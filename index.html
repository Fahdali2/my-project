<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الفزعة ماركة | كل ما تحتاجه في مكان واحد</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Tajawal', sans-serif;
        margin: 0;
        background: #f5f5f5;
        color: #333;
    }

    /* Header */
    header {
        background: #ff6f00;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
    }

    .search-box {
        width: 100%;
        padding: 10px;
        background: #fff;
        border-bottom: 1px solid #ddd;
    }

    .search-box input {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    /* Categories */
    nav {
        background: #fff;
        padding: 10px;
        display: flex;
        overflow-x: auto;
        gap: 15px;
        border-bottom: 1px solid #ddd;
    }

    nav a {
        text-decoration: none;
        color: #444;
        font-size: 15px;
        font-weight: 500;
        white-space: nowrap;
    }

    /* Banner */
    .banner {
        background: #ffe0c2;
        padding: 15px;
        text-align: center;
        font-size: 16px;
        font-weight: 600;
        color: #333;
    }

    /* Products Grid */
    .products {
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 15px;
    }

    .product {
        background: #fff;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 0 5px rgba(0,0,0,0.1);
        text-align: center;
    }

    .product img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 8px;
    }

    .product h3 {
        font-size: 15px;
        margin: 10px 0 5px;
    }

    .product .price {
        font-size: 16px;
        font-weight: 700;
        color: #ff6f00;
    }

    .product .sold {
        font-size: 13px;
        color: #777;
    }

    .product .rating {
        font-size: 14px;
        color: #f4b400;
        margin-top: 5px;
    }

    /* Bottom Navigation */
    .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: #fff;
        border-top: 1px solid #ddd;
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
    }

    .bottom-nav div {
        text-align: center;
        font-size: 13px;
        color: #444;
    }

    .bottom-nav img {
        width: 26px;
        margin-bottom: 5px;
    }
</style>

</head>
<body>

<header>
    الفزعة ماركة
</header>

<div class="search-box">
    <input type="text" placeholder="ابحث عن المنتجات...">
</div>

<nav>
    <a href="#">الكل</a>
    <a href="#">نساء</a>
    <a href="#">رجال</a>
    <a href="#">أطفال</a>
    <a href="#">إلكترونيات</a>
    <a href="#">منزل</a>
    <a href="#">رياضة</a>
    <a href="#">مجوهرات</a>
</nav>

<div class="banner">
    🚚 الشحن مجاناً — ضمان الاستلام
</div>

<section class="products">

    <div class="product">
        <img src="https://images.unsplash.com/photo-1528701800489-20be3c1c56a0">
        <h3>صندل نسائي أسود</h3>
        <div class="price">15.76 ر.س</div>
        <div class="sold">2.3K مبيعات</div>
        <div class="rating">⭐⭐⭐⭐⭐</div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">
        <h3>تيشيرت رجالي</h3>
        <div class="price">6.99 ر.س</div>
        <div class="sold">1.5K مبيعات</div>
        <div class="rating">⭐⭐⭐⭐⭐</div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad">
        <h3>سماعات بلوتوث</h3>
        <div class="price">129 ر.س</div>
        <div class="sold">126 مراجعة</div>
        <div class="rating">⭐⭐⭐⭐⭐</div>
    </div>

    <div class="product">
        <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
        <h3>ساعة ذكية AMOLED</h3>
        <div class="price">199 ر.س</div>
        <div class="sold">98 مراجعة</div>
        <div class="rating">⭐⭐⭐⭐⭐</div>
    </div>

</section>

<div class="bottom-nav">
    <div>
        <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png">
        الرئيسية
    </div>
    <div>
        <img src="https://cdn-icons-png.flaticon.com/512/833/833314.png">
        الأقسام
    </div>
    <div>
        <img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png">
        الحساب
    </div>
    <div>
        <img src="https://cdn-icons-png.flaticon.com/512/1170/1170678.png">
        السلة
    </div>
</div>

</body>
</html>
