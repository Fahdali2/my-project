<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفرعة ماركة | متجر التسوق</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:"Cairo",sans-serif;
      -webkit-tap-highlight-color:transparent;
    }

    body{
      background:#f7f8fa;
      color:#171717;
      padding-bottom:90px;
    }

    button{
      font-family:inherit;
      border:none;
      background:none;
      cursor:pointer;
    }

    img{
      width:100%;
      display:block;
    }

    .app{
      width:100%;
      max-width:1100px;
      margin:auto;
      background:#fff;
      min-height:100vh;
    }

    /* ================= HEADER ================= */

    .header{
      background:#fff;
      padding:14px 16px 8px;
      border-bottom:1px solid #eee;
      position:sticky;
      top:0;
      z-index:100;
    }

    .top-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }

    .header-side{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .menu-btn{
      width:42px;
      height:42px;
      font-size:28px;
      color:#111;
    }

    .brand{
      text-align:center;
      flex:1;
    }

    .brand-logo{
      font-size:27px;
      font-weight:900;
      line-height:1.2;
    }

    .brand-logo span{
      display:inline-block;
      color:#111;
    }

    .brand-icon{
      color:#ffbf18;
      font-size:28px;
      margin-left:4px;
    }

    .brand-sub{
      font-size:11px;
      font-weight:600;
      color:#555;
      margin-top:2px;
    }

    .cart-top{
      position:relative;
      min-width:48px;
      text-align:center;
      color:#111;
    }

    .cart-top .cart-icon{
      font-size:31px;
      line-height:28px;
    }

    .cart-label{
      font-size:11px;
      margin-top:2px;
    }

    .cart-count{
      position:absolute;
      top:-7px;
      right:0;
      background:#e50914;
      color:#fff;
      width:22px;
      height:22px;
      border-radius:50%;
      font-size:12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    /* ================= SEARCH ================= */

    .search-box{
      height:55px;
      border:1px solid #ddd;
      border-radius:28px;
      overflow:hidden;
      display:flex;
      align-items:center;
      background:#fff;
    }

    .search-btn{
      width:65px;
      height:100%;
      background:#080808;
      color:#fff;
      font-size:26px;
      border-radius:50%;
      margin:3px;
      flex-shrink:0;
    }

    .camera-btn{
      width:55px;
      font-size:25px;
      color:#222;
      border-right:1px solid #eee;
    }

    .search-box input{
      flex:1;
      height:100%;
      border:none;
      outline:none;
      font-size:13px;
      padding:0 14px;
      color:#222;
      background:transparent;
    }

    /* ================= CATEGORIES ================= */

    .categories{
      display:flex;
      gap:24px;
      overflow-x:auto;
      padding:15px 8px 10px;
      scrollbar-width:none;
      direction:rtl;
    }

    .categories::-webkit-scrollbar{
      display:none;
    }

    .category{
      white-space:nowrap;
      font-size:13px;
      color:#444;
      padding-bottom:9px;
      position:relative;
    }

    .category.active{
      color:#111;
      font-weight:800;
    }

    .category.active::after{
      content:"";
      position:absolute;
      right:0;
      left:0;
      bottom:0;
      height:3px;
      background:#111;
      border-radius:10px;
    }

    /* ================= BENEFITS ================= */

    .benefits{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      padding:12px 15px;
      background:#fafafa;
    }

    .benefit{
      min-height:82px;
      border-radius:10px;
      padding:15px;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .benefit.free{
      background:linear-gradient(120deg,#eef8f1,#f6fbf8);
    }

    .benefit.guarantee{
      background:linear-gradient(120deg,#fff8ee,#fffdf9);
    }

    .benefit-icon{
      font-size:34px;
    }

    .benefit strong{
      display:block;
      font-size:14px;
    }

    .benefit small{
      display:block;
      color:#555;
      margin-top:4px;
      font-size:11px;
    }

    /* ================= GREEN BANNER ================= */

    .trust-banner{
      margin:8px 15px 18px;
      background:linear-gradient(90deg,#006319,#078527);
      color:#fff;
      border-radius:8px;
      padding:10px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:13px;
      font-weight:700;
    }

    /* ================= SECTIONS ================= */

    .section{
      padding:0 15px 20px;
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin:10px 0 14px;
    }

    .section-title h2{
      font-size:17px;
      font-weight:800;
    }

    .section-title a{
      text-decoration:none;
      color:#222;
      font-size:13px;
      font-weight:700;
    }

    /* ================= DEALS ================= */

    .deals{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:9px;
      overflow:hidden;
    }

    .deal-card{
      background:#fff;
      border-radius:9px;
      overflow:hidden;
    }

    .deal-image{
      height:180px;
      background:#f2f2f2;
      overflow:hidden;
    }

    .deal-image img{
      height:100%;
      object-fit:cover;
    }

    .deal-price{
      color:#c9302c;
      font-weight:800;
      font-size:14px;
      padding:7px 4px 0;
      text-align:center;
    }

    .deal-sold{
      font-size:10px;
      color:#777;
      text-align:center;
      padding-bottom:5px;
    }

    /* ================= TABS ================= */

    .tabs{
      display:flex;
      gap:25px;
      padding:14px 15px 8px;
      border-top:1px solid #eee;
      border-bottom:1px solid #eee;
      overflow-x:auto;
      white-space:nowrap;
      scrollbar-width:none;
    }

    .tabs::-webkit-scrollbar{
      display:none;
    }

    .tab{
      font-size:13px;
      color:#555;
      padding-bottom:8px;
      position:relative;
      font-weight:600;
    }

    .tab.active{
      color:#111;
      font-weight:800;
    }

    .tab.active::after{
      content:"";
      position:absolute;
      bottom:0;
      right:0;
      left:0;
      height:3px;
      background:#111;
      border-radius:10px;
    }

    /* ================= PRODUCTS ================= */

    .products{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      padding:14px 15px 25px;
    }

    .product-card{
      background:#fff;
      border:1px solid #ededed;
      border-radius:10px;
      overflow:hidden;
      position:relative;
      box-shadow:0 2px 10px rgba(0,0,0,.025);
      transition:.2s;
    }

    .product-card:active{
      transform:scale(.98);
    }

    .product-image{
      width:100%;
      aspect-ratio:1/1;
      background:#f5f5f5;
      position:relative;
      overflow:hidden;
    }

    .product-image img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .heart{
      position:absolute;
      top:10px;
      right:10px;
      width:34px;
      height:34px;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:20px;
      z-index:2;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .heart.active{
      color:#e50914;
    }

    .product-info{
      padding:9px 10px 10px;
    }

    .product-name{
      font-size:12px;
      font-weight:600;
      line-height:1.7;
      height:42px;
      overflow:hidden;
      color:#222;
    }

    .product-meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-top:6px;
      min-height:20px;
    }

    .rating{
      font-size:12px;
      color:#111;
      white-space:nowrap;
    }

    .reviews{
      font-size:10px;
      color:#777;
    }

    .stars{
      letter-spacing:1px;
    }

    .product-bottom{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:8px;
    }

    .price{
      font-size:14px;
      font-weight:800;
      color:#222;
    }

    .currency{
      font-size:10px;
    }

    .add-cart{
      width:40px;
      height:40px;
      border:1px solid #ddd;
      border-radius:10px;
      font-size:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fff;
    }

    .badge{
      display:inline-block;
      border:1px solid #31904a;
      color:#237b39;
      padding:2px 6px;
      border-radius:4px;
      font-size:9px;
      margin-bottom:4px;
    }

    /* ================= LOADING ================= */

    .loading{
      grid-column:1/-1;
      text-align:center;
      padding:30px;
      color:#777;
    }

    .load-more-wrap{
      text-align:center;
      padding:5px 0 25px;
    }

    .load-more{
      background:#111;
      color:#fff;
      padding:12px 35px;
      border-radius:8px;
      font-size:14px;
      font-weight:700;
    }

    /* ================= BOTTOM NAV ================= */

    .bottom-nav{
      position:fixed;
      bottom:0;
      right:0;
      left:0;
      background:#fff;
      border-top:1px solid #ddd;
      z-index:200;
      display:flex;
      justify-content:center;
    }

    .bottom-nav-inner{
      width:100%;
      max-width:1100px;
      display:flex;
      justify-content:space-around;
      padding:8px 5px 6px;
    }

    .nav-item{
      text-align:center;
      font-size:10px;
      color:#333;
      position:relative;
      min-width:60px;
    }

    .nav-item .nav-icon{
      font-size:25px;
      display:block;
      line-height:28px;
    }

    .nav-item.active{
      color:#e50914;
      font-weight:800;
    }

    .nav-badge{
      position:absolute;
      top:-5px;
      right:8px;
      background:#e50914;
      color:white;
      min-width:18px;
      height:18px;
      border-radius:10px;
      font-size:9px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    /* ================= CART MODAL ================= */

    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      z-index:500;
      display:none;
      align-items:flex-end;
    }

    .overlay.show{
      display:flex;
    }

    .cart-modal{
      width:100%;
      max-width:1100px;
      margin:auto;
      background:#fff;
      border-radius:20px 20px 0 0;
      padding:20px;
      max-height:75vh;
      overflow:auto;
    }

    .cart-modal-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .cart-item{
      display:flex;
      gap:10px;
      align-items:center;
      padding:10px 0;
      border-bottom:1px solid #eee;
    }

    .cart-item img{
      width:60px;
      height:60px;
      object-fit:cover;
      border-radius:8px;
    }

    .cart-item-info{
      flex:1;
    }

    .cart-total{
      font-weight:900;
      font-size:18px;
      margin:15px 0;
    }

    .checkout{
      width:100%;
      padding:14px;
      background:#e50914;
      color:#fff;
      border-radius:10px;
      font-weight:800;
      font-size:15px;
    }

    /* ================= DESKTOP ================= */

    @media(min-width:700px){

      body{
        background:#eee;
      }

      .app{
        box-shadow:0 0 30px rgba(0,0,0,.08);
      }

      .products{
        grid-template-columns:repeat(4,1fr);
      }

      .product-name{
        font-size:13px;
      }

      .benefit strong{
        font-size:16px;
      }
    }

    @media(max-width:500px){

      .brand-logo{
        font-size:23px;
      }

      .benefits{
        gap:7px;
      }

      .benefit{
        padding:10px;
        min-height:72px;
      }

      .benefit-icon{
        font-size:27px;
      }

      .benefit strong{
        font-size:12px;
      }

      .benefit small{
        font-size:9px;
      }

      .deals{
        gap:7px;
      }

      .deal-image{
        height:180px;
      }

      .deal-price{
        font-size:12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="top-header">

      <div class="cart-top" onclick="openCart()">
        <div class="cart-icon">🛒</div>
        <span class="cart-count" id="topCartCount">0</span>
        <div class="cart-label">السلة</div>
      </div>

      <div class="brand">
        <div class="brand-logo">
          <span>🛍️</span> الفرعة ماركة
        </div>
        <div class="brand-sub">كل ما تحتاجه في مكان واحد</div>
      </div>

      <div class="header-side">
        <button class="menu-btn">☰</button>
      </div>

    </div>

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="ابحث عن منتج أو علامة تجارية..."
        oninput="searchProducts()"
      >
      <button class="camera-btn">📷</button>
      <button class="search-btn">⌕</button>
    </div>

    <div class="categories" id="categories">
      <button class="category active" onclick="selectCategory('الكل',this)">الكل</button>
      <button class="category" onclick="selectCategory('نساء',this)">نساء</button>
      <button class="category" onclick="selectCategory('رجال',this)">رجال</button>
      <button class="category" onclick="selectCategory('الرئيسية',this)">الرئيسية</button>
      <button class="category" onclick="selectCategory('مجوهرات',this)">مجوهرات</button>
      <button class="category" onclick="selectCategory('رياضات',this)">رياضات</button>
      <button class="category" onclick="selectCategory('أطفال',this)">أطفال</button>
      <button class="category" onclick="selectCategory('إلكترونيات',this)">إلكترونيات</button>
      <button class="category" onclick="selectCategory('منزل',this)">منزل</button>
    </div>

  </header>


  <!-- BENEFITS -->

  <section class="benefits">

    <div class="benefit free">
      <div class="benefit-icon">✓</div>
      <div>
        <strong>الشحن مجاناً</strong>
        <small>خاص بك</small>
      </div>
    </div>

    <div class="benefit guarantee">
      <div class="benefit-icon">🚚</div>
      <div>
        <strong>ضمان الاستلام</strong>
        <small>استرداد المبلغ المدفوع عند وجود مشكلة</small>
      </div>
    </div>

  </section>


  <div class="trust-banner">
    <span>🛡️ لماذا تختار الفرعة ماركة؟</span>
    <span>‹ مدفوعات آمنة</span>
  </div>


  <!-- DEALS -->

  <section class="section">

    <div class="section-title">
      <a href="#">❮ عروض التخفيضات</a>
      <h2>كمية محدودة في المخزون</h2>
    </div>

    <div class="deals" id="dealsContainer"></div>

  </section>


  <!-- PRODUCT TABS -->

  <div class="tabs">
    <button class="tab active" onclick="changeSort('all',this)">الكل</button>
    <button class="tab" onclick="changeSort('popular',this)">⚡ المفضلات</button>
    <button class="tab" onclick="changeSort('rating',this)">⭐ منتجات بتقييم 5 نجوم</button>
    <button class="tab" onclick="changeSort('top',this)">👍 المنتجات الأعلى تقييماً</button>
  </div>


  <!-- PRODUCTS -->

  <main class="products" id="productsContainer">
    <div class="loading">جاري تحميل المنتجات...</div>
  </main>

  <div class="load-more-wrap">
    <button class="load-more" id="loadMoreBtn" onclick="loadMore()">
      عرض المزيد
    </button>
  </div>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <div class="bottom-nav-inner">

    <button class="nav-item active">
      <span class="nav-icon">⌂</span>
      الرئيسية
    </button>

    <button class="nav-item">
      <span class="nav-icon">▦</span>
      الفئات
    </button>

    <button class="nav-item">
      <span class="nav-icon">♙</span>
      حسابي
      <span class="nav-badge">99+</span>
    </button>

    <button class="nav-item" onclick="openCart()">
      <span class="nav-icon">🛒</span>
      عربة التسوق
      <span class="nav-badge" id="bottomCartCount">0</span>
    </button>

  </div>

</nav>


<!-- CART -->

<div class="overlay" id="cartOverlay">

  <div class="cart-modal">

    <div class="cart-modal-header">
      <button onclick="closeCart()" style="font-size:25px">✕</button>
      <h2>عربة التسوق 🛒</h2>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
      الإجمالي: <span id="cartTotal">0</span> ر.س
    </div>

    <button class="checkout">
      متابعة الطلب
    </button>

  </div>

</div>


<script>

/* =========================================
   المتغيرات الرئيسية
========================================= */

let allProducts = [];
let filteredProducts = [];
let visibleCount = 20;
let selectedCategory = "الكل";
let cart = [];


/* =========================================
   صور احتياطية
========================================= */

const fallbackImages = [
  "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80",
  "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80",
  "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80",
  "https://images.unsplash.com/photo-1546868871-7041f2a55e12?auto=format&fit=crop&w=600&q=80",
  "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80",
  "https://images.unsplash.com/photo-1523779917675-b6ed3a42a561?auto=format&fit=crop&w=600&q=80"
];


/* =========================================
   تحميل المنتجات من products_1500.json
========================================= */

async function loadProducts(){

  try{

    const response = await fetch("./products_1500.json");

    if(!response.ok){
      throw new Error("لم يتم العثور على ملف المنتجات");
    }

    const data = await response.json();

    if(Array.isArray(data)){
      allProducts = data;
    }
    else if(Array.isArray(data.products)){
      allProducts = data.products;
    }
    else{
      allProducts = [];
    }

    normalizeProducts();

    filteredProducts = [...allProducts];

    renderDeals();

    renderProducts();

  }
  catch(error){

    console.error(error);

    document.getElementById("productsContainer").innerHTML = `
      <div class="loading">
        لم يتم تحميل المنتجات.<br><br>
        تأكد أن اسم الملف هو:<br>
        <b>products_1500.json</b>
      </div>
    `;
  }
}


/* =========================================
   توحيد شكل البيانات
========================================= */

function normalizeProducts(){

  allProducts = allProducts.map((product,index)=>{

    let image = "";

    if(product.images && Array.isArray(product.images) && product.images.length){
      image = product.images[0];
    }
    else if(product.image){
      image = product.image;
    }
    else if(product.imageUrl){
      image = product.imageUrl;
    }
    else if(product.thumbnail){
      image = product.thumbnail;
    }
    else{
      image = fallbackImages[index % fallbackImages.length];
    }

    return {

      id:
        product.id ||
        product.productId ||
        index + 1,

      name:
        product.name ||
        product.title ||
        product.productName ||
        "منتج مميز",

      price:
        Number(
          product.price ||
          product.currentPrice ||
          product.salePrice ||
          (Math.random() * 500 + 20).toFixed(2)
        ),

      image: image,

      images:
        product.images ||
        [image],

      rating:
        Number(
          product.rating ||
          product.rate ||
          (Math.random() * 1.5 + 3.5).toFixed(1)
        ),

      reviews:
        product.reviews ||
        product.reviewCount ||
        Math.floor(Math.random() * 900 + 10),

      category:
        product.category ||
        product.categoryName ||
        "متنوع",

      sold:
        product.sold ||
        product.sales ||
        Math.floor(Math.random() * 10000 + 100),

      discount:
        product.discount ||
        Math.floor(Math.random() * 50 + 5),

      badge:
        product.badge ||
        ""

    };

  });

}


/* =========================================
   عرض عروض التخفيضات
========================================= */

function renderDeals(){

  const container = document.getElementById("dealsContainer");

  const deals = [...allProducts]
    .sort((a,b)=> b.discount - a.discount)
    .slice(0,4);

  container.innerHTML = deals.map(product=>`

    <div class="deal-card">

      <div class="deal-image">
        <img
          src="${escapeHTML(product.image)}"
          alt="${escapeHTML(product.name)}"
          loading="lazy"
          onerror="this.src='${fallbackImages[0]}'"
        >
      </div>

      <div class="deal-price">
        ${formatPrice(product.price)} ر.س
      </div>

      <div class="deal-sold">
        تم بيع ${formatNumber(product.sold)}
      </div>

    </div>

  `).join("");

}


/* =========================================
   عرض المنتجات
========================================= */

function renderProducts(){

  const container = document.getElementById("productsContainer");

  const productsToShow = filteredProducts.slice(0,visibleCount);

  if(productsToShow.length === 0){

    container.innerHTML = `
      <div class="loading">
        لا توجد منتجات مطابقة للبحث 🔍
      </div>
    `;

    return;
  }

  container.innerHTML = productsToShow.map(product=>{

    const stars = getStars(product.rating);

    return `

      <article class="product-card">

        <div class="product-image">

          <button
            class="heart"
            onclick="toggleFavorite(this)"
            aria-label="إضافة للمفضلة"
          >
            ♡
          </button>

          <img
            src="${escapeHTML(product.image)}"
            alt="${escapeHTML(product.name)}"
            loading="lazy"
            onerror="this.src='${fallbackImages[0]}'"
          >

        </div>

        <div class="product-info">

          ${product.badge ? `<span class="badge">${escapeHTML(product.badge)}</span>` : ""}

          <div class="product-name">
            ${escapeHTML(product.name)}
          </div>

          <div class="product-meta">

            <div class="rating">
              <span class="reviews">(${formatNumber(product.reviews)})</span>
              <span class="stars">${stars}</span>
            </div>

          </div>

          <div class="product-bottom">

            <div class="price">
              ${formatPrice(product.price)}
              <span class="currency">ر.س</span>
            </div>

            <button
              class="add-cart"
              onclick="addToCart(${product.id})"
              aria-label="أضف للسلة"
            >
              🛒
            </button>

          </div>

        </div>

      </article>

    `;

  }).join("");

  const button = document.getElementById("loadMoreBtn");

  if(visibleCount >= filteredProducts.length){
    button.style.display = "none";
  }
  else{
    button.style.display = "inline-block";
  }

}


/* =========================================
   عرض المزيد
========================================= */

function loadMore(){

  visibleCount += 20;

  renderProducts();

}


/* =========================================
   البحث
========================================= */

function searchProducts(){

  const value = document
    .getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  filteredProducts = allProducts.filter(product=>{

    const matchesSearch =
      product.name.toLowerCase().includes(value) ||
      String(product.category).toLowerCase().includes(value);

    const matchesCategory =
      selectedCategory === "الكل" ||
      String(product.category).includes(selectedCategory);

    return matchesSearch && matchesCategory;

  });

  visibleCount = 20;

  renderProducts();

}


/* =========================================
   اختيار التصنيف
========================================= */

function selectCategory(category,element){

  selectedCategory = category;

  document
    .querySelectorAll(".category")
    .forEach(button=>button.classList.remove("active"));

  element.classList.add("active");

  searchProducts();

}


/* =========================================
   الترتيب
========================================= */

function changeSort(type,element){

  document
    .querySelectorAll(".tab")
    .forEach(tab=>tab.classList.remove("active"));

  element.classList.add("active");

  if(type === "popular"){

    filteredProducts.sort((a,b)=> b.sold - a.sold);

  }

  else if(type === "rating"){

    filteredProducts.sort((a,b)=> b.rating - a.rating);

  }

  else if(type === "top"){

    filteredProducts.sort((a,b)=>{

      return (
        (b.rating * b.reviews) -
        (a.rating * a.reviews)
      );

    });

  }

  else{

    filteredProducts = [...allProducts];

  }

  visibleCount = 20;

  renderProducts();

}


/* =========================================
   المفضلة
========================================= */

function toggleFavorite(button){

  button.classList.toggle("active");

  if(button.classList.contains("active")){
    button.innerHTML = "♥";
  }
  else{
    button.innerHTML = "♡";
  }

}


/* =========================================
   السلة
========================================= */

function addToCart(id){

  const product = allProducts.find(
    item => String(item.id) === String(id)
  );

  if(!product) return;

  const existing = cart.find(
    item => String(item.id) === String(id)
  );

  if(existing){
    existing.quantity++;
  }
  else{
    cart.push({
      ...product,
      quantity:1
    });
  }

  updateCartCount();

  showToast("تمت إضافة المنتج إلى السلة 🛒");

}


/* =========================================
   تحديث عداد السلة
========================================= */

function updateCartCount(){

  const total = cart.reduce(
    (sum,item)=>sum + item.quantity,
    0
  );

  document.getElementById("topCartCount").textContent = total;

  document.getElementById("bottomCartCount").textContent = total;

}


/* =========================================
   فتح السلة
========================================= */

function openCart(){

  const overlay = document.getElementById("cartOverlay");

  const container = document.getElementById("cartItems");

  if(cart.length === 0){

    container.innerHTML = `
      <div style="text-align:center;padding:30px;color:#777">
        سلة التسوق فارغة 🛒
      </div>
    `;

    document.getElementById("cartTotal").textContent = "0";

  }
  else{

    container.innerHTML = cart.map(item=>`

      <div class="cart-item">

        <img
          src="${escapeHTML(item.image)}"
          alt="${escapeHTML(item.name)}"
        >

        <div class="cart-item-info">

          <strong style="font-size:13px">
            ${escapeHTML(item.name)}
          </strong>

          <div style="font-size:12px;color:#777;margin-top:4px">
            الكمية: ${item.quantity}
          </div>

          <div style="font-weight:bold;margin-top:4px">
            ${formatPrice(item.price * item.quantity)} ر.س
          </div>

        </div>

        <button
          onclick="removeFromCart(${item.id})"
          style="color:#e50914;font-size:20px"
        >
          ✕
        </button>

      </div>

    `).join("");

    const total = cart.reduce(
      (sum,item)=>sum + (item.price * item.quantity),
      0
    );

    document.getElementById("cartTotal").textContent =
      formatPrice(total);

  }

  overlay.classList.add("show");

}


/* =========================================
   إغلاق السلة
========================================= */

function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


/* =========================================
   حذف من السلة
========================================= */

function removeFromCart(id){

  cart = cart.filter(
    item => String(item.id) !== String(id)
  );

  updateCartCount();

  openCart();

}


/* =========================================
   النجوم
========================================= */

function getStars(rating){

  const rounded = Math.round(rating);

  let result = "";

  for(let i=1;i<=5;i++){

    result += i <= rounded ? "★" : "☆";

  }

  return result;

}


/* =========================================
   تنسيق السعر
========================================= */

function formatPrice(price){

  return Number(price || 0).toLocaleString(
    "en-US",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


/* =========================================
   تنسيق الأرقام
========================================= */

function formatNumber(number){

  const value = Number(number || 0);

  if(value >= 1000){

    return (value / 1000).toFixed(1) + "K+";

  }

  return value;

}


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value){

  if(value === undefined || value === null){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   إشعار صغير
========================================= */

function showToast(message){

  const oldToast = document.getElementById("toast");

  if(oldToast){
    oldToast.remove();
  }

  const toast = document.createElement("div");

  toast.id = "toast";

  toast.textContent = message;

  toast.style.cssText = `
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    color:#fff;
    padding:12px 20px;
    border-radius:30px;
    z-index:9999;
    font-size:13px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
  `;

  document.body.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },2000);

}


/* =========================================
   بدء تحميل المتجر
========================================= */

loadProducts();

</script>

</body>
</html>
